# Acer Nitro extras.
#
# The mainline acer-wmi module handles rfkill / wmi helpers. It is safe to load
# by default on the AN515-58 (verified).
options acer-wmi
#
# acer-wmi-battery: leave the charge limit untouched at boot.
# To force the 80% limiter on at every boot, uncomment:
# options acer-wmi-battery enable_health_mode=1
